<style>
/* Layout: a single phone-width column, big rounded cards, black pill nav floating at the bottom. */
:root {
  --bg: #f3f6f8;
  --card: #ffffff;
  --card2: #f8fafb;
  --ink: #17252b;
  --muted: #6b7b82;
  --line: rgba(23, 37, 43, .10);
  --yellow: #20b7a5;
  --yellow-ink: #062e2a;
  --yellow-edge: transparent;
  --hero: #102b32;
  --hero-ink: #ffffff;
  --hero-mut: rgba(255, 255, 255, .62);
  --nav: #102b32;
  --nav-ink: #ffffff;
  --seg-on: #102b32;
  --seg-on-ink: #ffffff;
  --track: #dce7e9;
  --bad: #b3261e;
  --ok: #1b7f3b;
  --font: 'Vazirmatn', Tahoma, 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b171a;
    --card: #122327;
    --card2: #192c30;
    --ink: #edf7f6;
    --muted: #9db2b5;
    --line: rgba(207, 239, 235, .12);
    --yellow-edge: transparent;
    --hero: #15383d;
    --nav: #183a3f;
    --seg-on: #20b7a5;
    --seg-on-ink: #0b0b0c;
    --track: #294347;
    --bad: #ff8a80;
    --ok: #7bd88f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0b171a;
    --card: #122327;
    --card2: #192c30;
    --ink: #edf7f6;
    --muted: #9db2b5;
    --line: rgba(207, 239, 235, .12);
    --yellow-edge: transparent;
    --hero: #15383d;
    --nav: #183a3f;
    --seg-on: #20b7a5;
    --seg-on-ink: #0b0b0c;
    --track: #294347;
    --bad: #ff8a80;
    --ok: #7bd88f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.7;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
:root[data-theme="dark"] :focus-visible { outline-color: var(--yellow); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :focus-visible { outline-color: var(--yellow); } }
.num, .tn { font-variant-numeric: tabular-nums; }
svg { display: block; }

.app { max-width: 480px; margin: 0 auto; padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 2px 14px; }
.brand-name { display:flex; flex-direction:column; line-height:1.2; gap:3px; }
.brand-name small { color:var(--muted); font-size:10px; font-weight:500; letter-spacing:.2px; }
.logo img { width:30px; height:30px; object-fit:contain; }
.settings-footer { text-align:center; color:var(--muted); font-size:11px; padding:10px 8px 20px; letter-spacing:.35px; }
.vehicle-actions { display:flex; gap:8px; flex-wrap:wrap; }
.vehicle-actions .btn-ghost { flex:1; min-width:130px; }
.btn-danger { color:var(--bad); border:1px solid var(--line); background:var(--card2); }

.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; }
.logo { width: 40px; height: 40px; border-radius: 50%; background: var(--yellow); color: var(--yellow-ink); display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--yellow-edge); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line); }

#view { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--card); border-radius: 24px; padding: 18px; border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(20, 45, 50, .035); min-width: 0; }
.card2 { background: var(--card2); border-radius: 22px; padding: 14px 16px; min-width: 0; }
.h1 { font-size: 23px; line-height: 1.3; font-weight: 900; margin: 4px 2px 2px; text-wrap: balance; }
.h2 { font-size: 17px; font-weight: 800; margin: 0; }
.eyebrow { color: var(--muted); font-size: 13px; margin: 0; }
.mark { background: var(--yellow); color: var(--yellow-ink); padding: 0 10px; border-radius: 10px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* hero */
.hero { background: linear-gradient(135deg, var(--hero), #17665f); color: var(--hero-ink); border-radius: 28px; padding: 18px 18px 20px; position: relative; overflow: hidden; }
.hero > * { position: relative; }
.hero .wm { position: absolute; inset-inline-end: -8px; bottom: -34px; font-size: 150px; font-weight: 900; line-height: 1; color: rgba(255, 255, 255, .06); pointer-events: none; user-select: none; }
.hero .eyebrow { color: var(--hero-mut); margin-top: 16px; }
.hero .big { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.hero .big .num { font-size: 52px; line-height: 1.15; font-weight: 900; letter-spacing: -.5px; }
.hero .big .unit { font-size: 16px; color: var(--hero-mut); }
.hero-stats { display: flex; gap: 22px; margin-top: 6px; flex-wrap: wrap; }
.hero-stats b { font-size: 18px; margin-inline-end: 6px; }
.hero-stats span { color: var(--hero-mut); font-size: 13px; }
.split { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: rgba(255, 255, 255, .12); margin-top: 16px; gap: 2px; }
.split i { display: block; height: 100%; }
.split .car { background: #fff; }
.split .bike { background: var(--yellow); }
.legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12.5px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.car { background: var(--ink); }
.dot.bike { background: var(--yellow); box-shadow: 0 0 0 1px var(--yellow-edge); }

/* segmented controls */
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 99px; background: var(--card2); min-width: 0; }
.seg button { flex: 1; min-height: 40px; padding: 0 12px; border-radius: 99px; font-weight: 700; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.seg button.on { background: var(--seg-on); color: var(--seg-on-ink); }
.hero .seg { background: rgba(255, 255, 255, .1); }
.hero .seg button { color: var(--hero-mut); }
.hero .seg button.on { background: var(--yellow); color: #0b0b0c; }

/* quota slider card */
.quota-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.vname { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
.vicon { width: 42px; height: 42px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; flex: none; }
.tier { font-size: 12.5px; font-weight: 700; padding: 3px 12px; border-radius: 99px; background: var(--card2); white-space: nowrap; }
.tier.t1 { background: var(--yellow); color: var(--yellow-ink); box-shadow: 0 0 0 1px var(--yellow-edge); }
.q-big { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; }
.q-big .num { font-size: 40px; font-weight: 900; line-height: 1.2; }
.q-big .of { color: var(--muted); }
.track { position: relative; height: 34px; margin-top: 6px; }
.track .bar { position: absolute; inset-inline: 0; top: 7px; height: 20px; border-radius: 99px; background: var(--track); overflow: hidden; }
.track .fill { position: absolute; inset-inline-start: 0; top: 0; height: 100%; background: var(--yellow); border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--yellow-edge); min-width: 20px; }
.track .knob { position: absolute; top: 0; width: 34px; height: 34px; border-radius: 50%; background: var(--nav); color: var(--nav-ink); display: grid; place-items: center; font-size: 12px; font-weight: 800; box-shadow: 0 0 0 3px var(--card); }
.ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; padding: 0 4px; }

/* rows */
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; background: var(--card2); border-radius: 20px; padding: 10px 12px; min-width: 0; }
.row .ri { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: grid; place-items: center; flex: none; }
.row .rt { flex: 1; min-width: 0; }
.row .rt b { display: block; font-size: 14.5px; }
.row .rt span { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.row .rv { text-align: end; font-weight: 800; font-size: 14px; white-space: nowrap; }
.row .rv small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.del-btn { color: var(--bad); font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 99px; }
.del-btn.yes { background: var(--bad); color: #fff; }
.del-btn.no { color: var(--muted); }

.yellow-card { background: var(--yellow); color: var(--yellow-ink); border-radius: 28px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; box-shadow: inset 0 0 0 1.5px var(--yellow-edge); }
.yellow-card .big { font-size: 24px; font-weight: 900; line-height: 1.3; }
.yellow-card p { margin: 0; font-size: 13px; opacity: .85; }
.yellow-card .ic { width: 44px; height: 44px; border-radius: 50%; background: #0b0b0c; color: #fff; display: grid; place-items: center; flex: none; }

.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--card2); border-radius: 22px; padding: 12px 14px; box-shadow: inset 0 0 0 1.5px var(--ink); }
.banner p { margin: 0; font-size: 13px; }
.chip { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 99px; background: var(--card2); font-weight: 700; font-size: 13.5px; box-shadow: 0 0 0 1px var(--line); }
.chip.on { background: var(--seg-on); color: var(--seg-on-ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }

/* primary button (black pill + yellow arrow disc) */
.btn { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 8px 24px 8px 8px; padding-inline: 24px 8px; border-radius: 99px; background: var(--nav); color: var(--nav-ink); font-weight: 800; font-size: 16px; }
.btn .disc { width: 46px; height: 46px; border-radius: 50%; background: var(--yellow); color: var(--yellow-ink); display: grid; place-items: center; flex: none; }
.btn-ghost { min-height: 44px; padding: 0 18px; border-radius: 99px; background: var(--card2); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }
.btn-dark { min-height: 44px; padding: 0 18px; border-radius: 99px; background: var(--nav); color: var(--nav-ink); font-weight: 700; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
.inp, .sel { width: 100%; min-height: 48px; border-radius: 16px; border: 0; background: var(--card2); padding: 0 14px; box-shadow: 0 0 0 1px var(--line); min-width: 0; }
.inp:focus-visible, .sel:focus-visible { outline: 3px solid var(--ink); }
.sel { appearance: none; -webkit-appearance: none; background-image: none; text-align: start; }
.grid3 { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.hint.ok { color: var(--ok); font-weight: 700; }
.hint.err { color: var(--bad); font-weight: 700; }
textarea.inp { padding: 12px 14px; min-height: 96px; resize: vertical; direction: ltr; text-align: left; font-size: 12px; line-height: 1.5; }

/* liters ring */
.ringrow { display: flex; align-items: center; justify-content: center; gap: 14px; }
.step { width: 52px; height: 52px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line); flex: none; }
.ring { position: relative; width: 196px; height: 196px; flex: none; }
.ring svg { position: absolute; inset: 0; }
.ring .c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .lit { width: 110px; border: 0; background: transparent; text-align: center; font-size: 44px; font-weight: 900; line-height: 1.2; padding: 0; border-radius: 12px; }
.ring .lit:focus-visible { outline: 3px solid var(--ink); }
.ring .u { color: var(--muted); font-size: 13px; margin-top: -4px; }
.r-track { stroke: var(--track); }
.r-used { stroke: var(--ink); }
.r-new { stroke: var(--yellow); }
.r-edge { stroke: var(--yellow-edge); }
.breakdown { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; }
.breakdown div { display: flex; justify-content: space-between; gap: 10px; }
.breakdown .tot { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px; font-weight: 900; font-size: 18px; }

/* charts */
.chart { width: 100%; height: auto; }
.chart text { font-family: var(--font); fill: var(--muted); font-size: 8.5px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .b-car { fill: var(--ink); }
.chart .b-bike { fill: var(--yellow); stroke: var(--yellow-edge); stroke-width: .8; }
.chart .cur { fill: var(--ink); font-weight: 800; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .sel-bg { fill: var(--line); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--card2); border-radius: 20px; padding: 12px 14px; min-width: 0; }
.stat b { display: block; font-size: 20px; font-weight: 900; line-height: 1.4; overflow-wrap: anywhere; }
.stat span { color: var(--muted); font-size: 12.5px; }

/* map */
.mapbox { background: var(--card2); border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.mapbox svg { width: 100%; height: auto; }
.mapbox text { font-family: var(--font); }
.m-grid { stroke: var(--line); stroke-width: 1; }
.m-dot { fill: var(--ink); stroke: var(--card2); stroke-width: 2; cursor: pointer; }
.m-top { fill: var(--yellow); stroke: var(--yellow-edge); stroke-width: 2.5; cursor: pointer; }
.m-sel { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 3 3; }
.m-lbl { fill: var(--ink); font-size: 11px; font-weight: 700; paint-order: stroke; stroke: var(--card2); stroke-width: 3px; }
.m-small { fill: var(--muted); font-size: 10px; }
.rank { width: 30px; height: 30px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.rank.first { background: var(--yellow); color: var(--yellow-ink); box-shadow: 0 0 0 1px var(--yellow-edge); }
.meter { height: 6px; border-radius: 99px; background: var(--track); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.extlink { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--card); text-decoration: none; white-space: nowrap; }

/* nav */
.nav { position: fixed; z-index: 20; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); margin: 0 auto; max-width: 448px; background: var(--nav); border-radius: 99px; padding: 8px; display: flex; justify-content: space-between; gap: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.nav button { flex: 1; height: 52px; border-radius: 99px; color: var(--nav-ink); opacity: .78; display: grid; place-items: center; }
.nav button.on { background: var(--yellow); color: var(--yellow-ink); opacity: 1; box-shadow: 0 0 0 1.5px var(--yellow-edge); }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.empty { text-align: center; padding: 22px 10px; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

@media (prefers-reduced-motion: no-preference) {
  .track .fill { transition: width .4s ease; }
  .ring circle { transition: stroke-dasharray .25s ease; }
}
@media (max-width: 380px) {
  .hero .big .num { font-size: 42px; }
  .ring { width: 172px; height: 172px; }
  .step { width: 46px; height: 46px; }
}

.quota-head { flex-wrap: wrap; }
.chart, .mapbox svg { direction: ltr; }
.acts { display: flex; gap: 4px; margin-top: 2px; }
.acts .del-btn { padding-inline: 0 10px; }
.acts .del-btn.yes { padding: 6px 12px; }
button:disabled { cursor: default; }

</style>

<script>
var FuelLogic = (function () {
  'use strict';

  var PDIG = '۰۱۲۳۴۵۶۷۸۹';
  var MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  var MONTHS_SHORT = ['فرو', 'ارد', 'خرد', 'تیر', 'مرد', 'شهر', 'مهر', 'آبا', 'آذر', 'دی', 'بهم', 'اسف'];

  /* ---------- digits & formatting ---------- */
  function normDigits(s) {
    return String(s == null ? '' : s)
      .replace(/[۰-۹]/g, function (d) { return PDIG.indexOf(d); })
      .replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
      .replace(/٫/g, '.')
      .replace(/[،٬]/g, ',');
  }
  function parseNum(s) {
    var t = normDigits(s).replace(/\s/g, '').replace(/[,\/]/g, '.');
    var n = parseFloat(t);
    return isFinite(n) ? n : NaN;
  }
  function parsePrice(s) {
    var t = normDigits(s).replace(/[,\s]/g, '');
    var n = parseFloat(t);
    return isFinite(n) ? n : NaN;
  }
  var nf0, nf1;
  try {
    nf0 = new Intl.NumberFormat('fa-IR', { maximumFractionDigits: 0 });
    nf1 = new Intl.NumberFormat('fa-IR', { maximumFractionDigits: 1 });
  } catch (e) {
    nf0 = { format: function (n) { return String(Math.round(n)); } };
    nf1 = { format: function (n) { return String(n); } };
  }
  function digits(n) { return String(n).replace(/\d/g, function (d) { return PDIG[d]; }); }
  function toman(n) { return nf0.format(Math.round(n)); }
  function faL(n) { return nf1.format(Math.round(n * 10) / 10); }
  function compact(n) {
    if (n >= 1e6) return nf1.format(Math.round(n / 1e5) / 10) + ' میلیون';
    if (n >= 1e3) return nf0.format(Math.round(n / 1e3)) + ' هزار';
    return nf0.format(Math.round(n));
  }

  /* ---------- Jalali calendar (arithmetic 33-year algorithm) ---------- */
  function div(a, b) { return ~~(a / b); }
  function g2j(gy, gm, gd) {

  /* ---------- REPORTS ---------- */
  function repData() {
    var t = L.todayParts(), rows = rowsAll(), r = ui.rep, b = [], title, i;
    if (r.mode === 'day') {
      var n = L.dim(r.jy, r.jm);
      for (i = 1; i <= n; i++) b.push({ label: digits(i), name: digits(i) + ' ' + MONTHS[r.jm - 1], show: (i === 1 || i % 5 === 0), cur: (r.jy === t.jy && r.jm === t.jm && i === t.jd), rows: [] });
      rows.forEach(function (x) { if (x.jy === r.jy && x.jm === r.jm) b[x.jd - 1].rows.push(x); });
      title = MONTHS[r.jm - 1] + ' ' + digits(r.jy);
    } else if (r.mode === 'month') {
      for (i = 1; i <= 12; i++) b.push({ label: MS[i - 1], name: MONTHS[i - 1] + ' ' + digits(r.jy), show: true, cur: (r.jy === t.jy && i === t.jm), rows: [] });
      rows.forEach(function (x) { if (x.jy === r.jy) b[x.jm - 1].rows.push(x); });
      title = 'سال ' + digits(r.jy);
    } else {
      var minY = t.jy;
      rows.forEach(function (x) { if (x.jy < minY) minY = x.jy; });
      var start = Math.max(Math.min(minY, t.jy - 2), t.jy - 5);
      for (i = start; i <= t.jy; i++) b.push({ y: i, label: digits(i), name: 'سال ' + digits(i), show: true, cur: i === t.jy, rows: [] });

  function chartSvg(buckets, metric, selIdx) {
    var W = 340, H = 176, top = 12, bot = 24, left = 6, right = 288, aw = right - left, ah = H - top - bot;
    var vals = buckets.map(function (b) { return S.vehicles.map(function (v) { return metric === 'cost' ? b.s.v[v.id].cost : b.s.v[v.id].liters; }); });
    var totals = vals.map(function (a) { return a.reduce(function (x, y) { return x + y; }, 0); });
    var max = L.niceMax(Math.max.apply(null, totals.concat([0])));
    var out = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="نمودار ' + (metric === 'cost' ? 'هزینه' : 'مصرف') + '">';
    [0, 0.5, 1].forEach(function (f) {
      var y = top + ah - ah * f;
      out += '<line class="grid" x1="' + left + '" x2="' + right + '" y1="' + y + '" y2="' + y + '"/>';
      var txt = f === 0 ? '۰' : (metric === 'cost' ? L.compact(max * f) : faL(max * f));
      out += '<text x="' + (right + 6) + '" y="' + (y + 3) + '" text-anchor="start">' + txt + '</text>';
    });
    var bw = aw / buckets.length;
    buckets.forEach(function (b, i) {
      var x = right - (i + 1) * bw, w = Math.min(bw * 0.66, 26), bx = x + (bw - w) / 2, y = top + ah;
      if (selIdx === i) out += '<rect class="sel-bg" x="' + x + '" y="' + top + '" width="' + bw + '" height="' + ah + '" rx="4"/>';
      S.vehicles.forEach(function (v, k) {
        var val = vals[i][k];
        if (val > 0) {
          var h = Math.max(val / max * ah, 2);
          y -= h;
          out += '<rect class="b-' + v.kind + '" x="' + bx.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + w.toFixed(2) + '" height="' + h.toFixed(2) + '" rx="3"/>';
        }
      });
      if (b.show) out += '<text class="' + (b.cur ? 'cur' : '') + '" x="' + (x + bw / 2).toFixed(2) + '" y="' + (H - 8) + '" text-anchor="middle">' + b.label + '</text>';
      out += '<rect class="hit" data-act="bar" data-i="' + i + '" x="' + x.toFixed(2) + '" y="0" width="' + bw.toFixed(2) + '" height="' + (H - 4) + '"><title>' + esc(b.name) + '</title></rect>';
    });
    return out + '</svg>';

    var h = '<h1 class="h1">پمپ‌بنزین‌های <span class="mark">پرمراجعه</span></h1>';
    if (!st.length) {
      return h + '<section class="card"><div class="empty"><b>هنوز پمپی ثبت نشده</b>هنگام ثبت سوخت‌گیری نام پمپ و مختصاتش را وارد کن تا اینجا ببینی بیشتر به کدام می‌روی.</div></section>';
    }
    var maxV = st[0].visits, top = st[0];
    h += '<section class="yellow-card"><span class="ic">' + ic('pin', 24) + '</span><div><div class="big">' + esc(top.name) + '</div><p class="tn">' + digits(top.visits) + ' بار مراجعه · ' + faL(top.liters) + ' لیتر · ' + toman(top.cost) + ' تومان</p></div></section>';
    if (pts.length) {
      var W = 340, H = 280, P = L.project(pts, W, H, 44);
      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="موقعیت پمپ‌بنزین‌ها">';
      for (var gx = 0; gx <= W; gx += 42.5) svg += '<line class="m-grid" x1="' + gx + '" x2="' + gx + '" y1="0" y2="' + H + '"/>';
      for (var gy = 0; gy <= H; gy += 40) svg += '<line class="m-grid" x1="0" x2="' + W + '" y1="' + gy + '" y2="' + gy + '"/>';
      var km = 0.1, opts = [0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100];
      opts.forEach(function (o) { if (o * P.pxPerKm <= 100) km = o; });
      var kpx = km * P.pxPerKm;
      svg += '<path d="M14 ' + (H - 16) + 'h' + kpx.toFixed(1) + 'M14 ' + (H - 20) + 'v8M' + (14 + kpx).toFixed(1) + ' ' + (H - 20) + 'v8" stroke="currentColor" stroke-width="1.5" fill="none" style="color:var(--muted)"/>';
      svg += '<text class="m-small" x="14" y="' + (H - 24) + '" text-anchor="start">' + digits(km).replace('.', '٫') + ' کیلومتر</text>';
      svg += '<path d="M322 30v-14M317 21l5-5 5 5" stroke="currentColor" stroke-width="1.5" fill="none" style="color:var(--muted)" stroke-linecap="round"/><text class="m-small" x="322" y="43" text-anchor="middle">شمال</text>';
      st.forEach(function (s, i) {
        if (s.lat == null) return;
        var p = P.xy(s), r = 8 + 13 * Math.pow(s.visits / maxV, 0.6), isTop = i === 0;
        if (ui.mapSel === i) svg += '<circle class="m-sel" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + (r + 6).toFixed(1) + '"/>';
        svg += '<circle class="' + (isTop ? 'm-top' : 'm-dot') + '" data-act="map-sel" data-i="' + i + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + r.toFixed(1) + '"><title>' + esc(s.name) + '</title></circle>';
        svg += '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + 3.5).toFixed(1) + '" text-anchor="middle" pointer-events="none" style="font-size:10px;font-weight:800;fill:' + (isTop ? '#0b0b0c' : 'var(--card2)') + '">' + digits(s.visits) + '</text>';
        var nm = s.name.length > 16 ? s.name.slice(0, 15) + '…' : s.name;
        svg += '<text class="m-lbl" x="' + p.x.toFixed(1) + '" y="' + (p.y - r - 5).toFixed(1) + '" text-anchor="middle" pointer-events="none">' + esc(nm) + '</text>';
      });
      svg += '</svg>';
      h += '<div class="mapbox">' + svg + '</div><p class="hint">نمودار موقعیت پمپ‌ها بدون نقشه‌ی خیابان. اندازه‌ی هر نقطه به تعداد مراجعه بستگی دارد. برای دیدن روی نقشه‌ی واقعی، «باز کردن در نقشه» را بزن.</p>';
    } else {
      h += '<section class="card"><div class="empty"><b>مختصات پمپی ثبت نشده</b>در برگه‌ی ثبت، مختصات یا لینک نقشه‌ی پمپ را هم بچسبان تا موقعیتش اینجا نشان داده شود.</div></section>';
    }
    var sel = ui.mapSel >= 0 && st[ui.mapSel] ? st[ui.mapSel] : null;
    if (sel) {
      h += '<section class="card2"><div class="row-between"><b>' + esc(sel.name) + '</b>' + (sel.lat != null ? '<a class="extlink" href="' + osmLink(sel) + '" target="_blank" rel="noopener">باز کردن در نقشه ' + ic('ext', 14) + '</a>' : '') + '</div><p class="hint tn">' + digits(sel.visits) + ' بار · ' + faL(sel.liters) + ' لیتر · ' + toman(sel.cost) + ' تومان · آخرین بار ' + L.fmtDay(sel.last, true) + '</p></section>';
    }
    h += '<section class="card"><h2 class="h2" style="margin-bottom:10px">رتبه‌بندی</h2><div class="rows">' + st.map(function (s, i) {
      var link = s.lat != null ? '<a class="extlink" href="' + osmLink(s) + '" target="_blank" rel="noopener">نقشه ' + ic('ext', 14) + '</a>' : '<span class="small muted">بدون مختصات</span>';
      return '<div class="row"><span class="rank' + (i === 0 ? ' first' : '') + ' tn">' + digits(i + 1) + '</span><div class="rt"><b>' + esc(s.name) + '</b><div class="meter"><i style="width:' + (s.visits / maxV * 100).toFixed(0) + '%"></i></div></div><div class="rv tn">' + digits(s.visits) + ' بار<small>' + faL(s.liters) + ' لیتر</small></div>' + link + '</div>';
    }).join('') + '</div></section>';
    return h;
  }

  /* ---------- SETTINGS ---------- */
  function backupText() { return JSON.stringify({ app: 'fuel', v: 1, settings: S, fills: fills }); }
  function viewSet() {
    var th = getTheme();
    var h = '<h1 class="h1">تنظیمات <span class="mark">کارت سوخت</span></h1>';
    h += '<section class="card stack"><h2 class="h2">ظاهر</h2>' + seg([['auto', 'خودکار'], ['light', 'روشن'], ['dark', 'تاریک']], th, 'set-theme') + '</section>';
    S.vehicles.forEach(function (v) {
      h += '<section class="card stack"><div class="vname"><span class="vicon">' + vIcon(v) + '</span>کارت سوخت ' + esc(v.name) + '</div>' +
        '<div class="field"><label for="vn-' + v.id + '">نام</label><input id="vn-' + v.id + '" class="inp" type="text" data-set="vname" data-id="' + v.id + '" value="' + esc(v.name) + '"></div>' +
        '<div class="grid2"><div class="field"><label for="vq-' + v.id + '">سهمیه‌ی ماهانه (لیتر)</label><input id="vq-' + v.id + '" class="inp tn" type="text" inputmode="decimal" data-set="vquota" data-id="' + v.id + '" value="' + faL(v.quota) + '"></div>' +
        '<div class="field"><label for="vp-' + v.id + '">قیمت سهمیه (تومان)</label><input id="vp-' + v.id + '" class="inp tn" type="text" inputmode="numeric" data-set="vp1" data-id="' + v.id + '" value="' + toman(v.p1) + '"></div></div>' +
        '<button type="button" class="btn-ghost btn-danger" data-act="del-vehicle" data-id="' + v.id + '">حذف این وسیله</button></section>';
    });
    h += '<section class="card stack"><h2 class="h2">افزودن وسیله</h2><p class="hint">برای هر خودرو یا موتور، سهمیه و آمار جداگانه نگه‌داری می‌شود.</p><div class="vehicle-actions"><button type="button" class="btn-ghost" data-act="add-vehicle" data-kind="car">＋ افزودن خودرو</button><button type="button" class="btn-ghost" data-act="add-vehicle" data-kind="bike">＋ افزودن موتور</button></div></section>';
    h += '<section class="card stack"><h2 class="h2">بعد از سهمیه</h2><p class="hint">این نرخ‌ها برای هر کارت و در هر ماه شمسی حساب می‌شوند.</p>' +
      '<div class="grid2"><div class="field"><label for="t2">حجم نیم‌بها (لیتر)</label><input id="t2" class="inp tn" type="text" inputmode="decimal" data-set="t2" value="' + faL(S.t2) + '"></div>' +
      '<div class="field"><label for="p2">قیمت نیم‌بها (تومان)</label><input id="p2" class="inp tn" type="text" inputmode="numeric" data-set="p2" value="' + toman(S.p2) + '"></div></div>' +
      '<div class="field"><label for="p3">قیمت آزاد (تومان)</label><input id="p3" class="inp tn" type="text" inputmode="numeric" data-set="p3" value="' + toman(S.p3) + '"></div></section>';
    h += '<section class="card stack"><h2 class="h2">پشتیبان‌گیری</h2><p class="hint">' + (mode === 'cloud'
      ? 'ذخیره‌سازی ابری فعال است و روی هر دستگاهی که این صفحه را با حساب خودت باز کنی همین اطلاعات را می‌بینی.'
      : 'اطلاعات فقط در همین مرورگر ذخیره می‌شود و با پاک شدن اطلاعات مرورگر از بین می‌رود. از متن پشتیبان زیر نسخه نگه دار.') + '</p>' +
      '<textarea id="backup" class="inp" readonly aria-label="متن پشتیبان">' + esc(backupText()) + '</textarea>' +
      '<button type="button" class="btn-dark" data-act="copy">' + ic('copy', 18) + ' کپی پشتیبان</button>' +
      '<div class="field"><label for="restore">بازیابی از متن پشتیبان</label><textarea id="restore" class="inp" placeholder="متن پشتیبان را اینجا بچسبان"></textarea></div>' +
      '<button type="button" class="btn-ghost" data-act="restore">بازیابی</button></section>';
    h += '<footer class="settings-footer">Designed &amp; Developed by Sajad Darvishi</footer>';
    return h;
  }

  /* ---------- render & navigation ---------- */
  var TABS = [['home', 'خانه', 'home'], ['rep', 'گزارش', 'chart'], ['add', 'ثبت سوخت‌گیری', 'pump'], ['map', 'نقشه', 'pin'], ['set', 'تنظیمات', 'sliders']];
  var VIEWS = { home: viewHome, add: viewAdd, rep: viewRep, map: viewMap, set: viewSet };
  function render() {
    $('#view').innerHTML = VIEWS[ui.tab]();
    var navEl = $('#nav');
    navEl.innerHTML = TABS.map(function (x) {
      return '<button type="button" data-act="tab" data-t="' + x[0] + '" class="' + (ui.tab === x[0] ? 'on' : '') + '" aria-label="' + x[1] + '" title="' + x[1] + '"' + (ui.tab === x[0] ? ' aria-current="page"' : '') + '>' + ic(x[2], 24) + '</button>';
    }).join('');
    $('#themeBtn').innerHTML = ic(effectiveTheme() === 'dark' ? 'sun' : 'moon', 22);
    if (ui.tab === 'add') { updateAdd(); updateGeo(); }
  }
  function go(tab) {
    ui.tab = tab; ui.confirm = null;
    render();
    window.scrollTo(0, 0);
  }

  var ACT = {
    tab: function (el) { go(el.getAttribute('data-t')); },
    theme: function () { setTheme(effectiveTheme() === 'dark' ? 'light' : 'dark'); render(); },
    'set-theme': function (el) { setTheme(el.getAttribute('data-v')); render(); },
    hero: function (el) { ui.hero = el.getAttribute('data-v'); render(); },
    'demo-off': function () { S.demoOff = true; persistSettings(); render(); toast('نمونه‌ها حذف شدند'); },
    'rep-mode': function (el) { ui.rep.mode = el.getAttribute('data-v'); ui.rep.sel = -1; render(); },
    'rep-metric': function (el) { ui.rep.metric = el.getAttribute('data-v'); render(); },
    'rep-nav': function (el) {
      var d = +el.getAttribute('data-d'), r = ui.rep;
      if (el.disabled) return;
      if (r.mode === 'day') { r.jm += d; if (r.jm < 1) { r.jm = 12; r.jy--; } if (r.jm > 12) { r.jm = 1; r.jy++; } }
      else if (r.mode === 'month') r.jy += d;
      r.sel = -1; render();
    },
    bar: function (el) { var i = +el.getAttribute('data-i'); ui.rep.sel = ui.rep.sel === i ? -1 : i; render(); },
    'del-ask': function (el) { ui.confirm = el.getAttribute('data-id'); render(); },
    'del-no': function () { ui.confirm = null; render(); },
    'del-yes': function (el) {
      var id = el.getAttribute('data-id');
      fills = fills.filter(function (f) { return f.id !== id; });
      ui.confirm = null;
      persistDelete(id);
      render();
      toast('حذف شد');
    },
    'add-veh': function (el) { ui.add.vid = el.getAttribute('data-v'); render(); },
    'add-vehicle': function (el) {
      var kind = el.getAttribute('data-kind'), count = S.vehicles.filter(function(v){ return v.kind === kind; }).length + 1;
      var id = 'veh-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
      S.vehicles.push({ id:id, name:(kind === 'bike' ? 'موتور ' : 'خودرو ') + digits(count), kind:kind, quota:kind === 'bike' ? 10 : 30, p1:1500 });
      persistSettings(); render(); toast('وسیله اضافه شد');
    },
    'del-vehicle': function (el) {
      var id = el.getAttribute('data-id'), v = vehById(id);
      if (!v) return;
      if (S.vehicles.length <= 1) { toast('حداقل یک وسیله باید باقی بماند'); return; }
      var removed = fills.filter(function(f){ return f.vid === id; });
      removed.forEach(function(f){ persistDelete(f.id); });
      fills = fills.filter(function(f){ return f.vid !== id; });
      S.vehicles = S.vehicles.filter(function(x){ return x.id !== id; });
      if (ui.add && ui.add.vid === id) ui.add.vid = S.vehicles[0].id;
      persistSettings(); render(); toast('وسیله و سوخت‌گیری‌های مرتبط حذف شدند');
    },
    'add-step': function (el) {
      var a = ui.add, d = +el.getAttribute('data-d');
      a.liters = Math.max(0, (isFinite(a.liters) ? a.liters : 0) + d);
      $('#add-liters').value = faL(a.liters);
      updateAdd();
    },
    'add-chip': function (el) { ui.add.liters = +el.getAttribute('data-l'); $('#add-liters').value = faL(ui.add.liters); updateAdd(); },
    'add-st': function (el) {
      var s = chipStations[+el.getAttribute('data-i')], a = ui.add;
      if (!s) return;
      a.station = s.name; a.lat = s.lat; a.lng = s.lng; a.coords = s.lat + ', ' + s.lng;
      $('#add-station').value = a.station; $('#add-coords').value = a.coords;
      updateGeo();
    },
    'add-submit': submitAdd,
    'map-sel': function (el) { var i = +el.getAttribute('data-i'); ui.mapSel = ui.mapSel === i ? -1 : i; render(); },
    copy: function () {
      var txt = backupText();
      function fb() { var ta = $('#backup'); ta.focus(); ta.select(); toast('متن انتخاب شد؛ دستی کپی کن'); }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('کپی شد'); }, fb);
        else fb();
      } catch (e) { fb(); }
    },
    restore: function () {
      var raw = $('#restore').value.trim(), o;
      try { o = JSON.parse(raw); } catch (e) { toast('متن پشتیبان درست نیست'); return; }
      if (!o || !Array.isArray(o.fills)) { toast('متن پشتیبان درست نیست'); return; }
      var ids = {}, n = 0;
      fills.forEach(function (f) { ids[f.id] = 1; });
      o.fills.forEach(function (f) {
        if (!f || typeof f.date !== 'string' || !(f.liters > 0) || typeof f.vid !== 'string') return;
        var c = { id: typeof f.id === 'string' && /^[A-Za-z0-9_-]+$/.test(f.id) ? f.id : newId(), vid: f.vid, date: f.date, liters: +f.liters, t: +f.t || Date.now() };
        if (typeof f.station === 'string' && f.station) c.station = f.station;
        if (typeof f.lat === 'number' && typeof f.lng === 'number') { c.lat = f.lat; c.lng = f.lng; }
        if (ids[c.id]) return;
        ids[c.id] = 1; fills.push(c); persistFill(c); n++;
      });
      if (o.settings) { S = mergeSettings(o.settings); persistSettings(); }
      render();
      toast('بازیابی شد: ' + digits(n) + ' ثبت');
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var fn = ACT[el.getAttribute('data-act')];
    if (fn) fn(el, e);
  });
  document.addEventListener('input', function (e) {
    var el = e.target, k = el.id;
    if (!ui.add || ui.tab !== 'add') return;
    if (k === 'add-liters') { ui.add.liters = L.parseNum(el.value); updateAdd(); }
    else if (k === 'add-station') ui.add.station = el.value;
    else if (k === 'add-coords') {
      var a = ui.add, p = L.parseCoords(el.value);
      a.coords = el.value; a.lat = p ? p.lat : null; a.lng = p ? p.lng : null;
      updateGeo();
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-in') === 'add-date') { syncDateFromSelects(); updateAdd(); return; }
    if (el.id === 'add-liters' && ui.add) { if (isFinite(ui.add.liters) && ui.add.liters >= 0) el.value = faL(ui.add.liters); return; }
    var key = el.getAttribute && el.getAttribute('data-set');
    if (!key) return;
    var id = el.getAttribute('data-id'), v = id ? vehById(id) : null, n;
    if (key === 'vname') { var nm = el.value.trim(); if (nm) v.name = nm; el.value = v.name; }
    else if (key === 'vquota') { n = L.parseNum(el.value); if (n > 0) v.quota = n; el.value = faL(v.quota); }
    else if (key === 'vp1') { n = L.parsePrice(el.value); if (n >= 0) v.p1 = n; el.value = toman(v.p1); }
    else if (key === 't2') { n = L.parseNum(el.value); if (n >= 0) S.t2 = n; el.value = faL(S.t2); }
    else if (key === 'p2') { n = L.parsePrice(el.value); if (n >= 0) S.p2 = n; el.value = toman(S.p2); }
    else if (key === 'p3') { n = L.parsePrice(el.value); if (n >= 0) S.p3 = n; el.value = toman(S.p3); }
    persistSettings();
    toast('ذخیره شد');
  });

  /* ---------- boot ---------- */
  applyTheme(getTheme());
  var loc = loadLocal();
  if (loc) { S = mergeSettings(loc.settings); fills = loc.fills; }
  render();
  initDb();
})();

</script>
<script>
// Register the offline cache when served from HTTPS or localhost.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("./sw.js").catch(function (err) { console.warn("Service worker registration failed", err); }); });
}
</script>
</body></html>
